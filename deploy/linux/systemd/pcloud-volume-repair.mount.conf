# /etc/systemd/system/srv-pcloud.mount.d/pcloud-volume-repair.conf — antes de montar el HDD de datos,
# comprobarlo y repararlo si quedó sin desmontar bien (ADR-0032). Wants y no Requires: si la
# comprobación no pudiera ni arrancar, el disco se monta igual (el StorageGuardian sigue vigilando).
# Instalado por pcloud-install-volume-repair.sh. No editar a mano.

[Unit]
Wants=pcloud-volume-repair.service
After=pcloud-volume-repair.service
